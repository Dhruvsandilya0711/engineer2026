<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Autoplay Carousel</title>
  
  <!-- Updated to Swiper 11 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
 
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #c3d1e1; 
      margin: 0;
      overflow: hidden;
    }

    .swiper {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 50px;
    }

    .swiper-slide {
      width: 250px; 
      height: 350px; 
      border-radius: 15px; 
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 3px solid transparent; 
      transition: border 0.3s ease;
    }

    .swiper-slide-active {
      border: 3px solid #fce205; 
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Adjusted Pagination Styling */
    .swiper-pagination {
      position: absolute;
      top: 10px !important; /* Forces it to the top inside the container */
      bottom: auto !important;
    }

    .swiper-pagination-bullet {
      background: #333;
      opacity: 0.5;
      width: 10px;
      height: 10px;
    }

    .swiper-pagination-bullet-active {
      background: #fce205; 
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Carousel Container -->
  <div class="swiper mySwiper">
    
    <!-- Moved Pagination INSIDE the Swiper container -->
    <div class="swiper-pagination"></div>

    <div class="swiper-wrapper">
      <!-- Added more slides to ensure loop: true works on wide desktop screens -->
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1512413914488-8422709219db?auto=format&fit=crop&w=400&q=80" alt="Slide 1"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=400&q=80" alt="Slide 2"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 3"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?auto=format&fit=crop&w=400&q=80" alt="Slide 4"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1528164344705-47542687000d?auto=format&fit=crop&w=400&q=80" alt="Slide 5"></div>
      <!-- Duplicates to prevent loop breaking -->
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1512413914488-8422709219db?auto=format&fit=crop&w=400&q=80" alt="Slide 6"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=400&q=80" alt="Slide 7"></div>
      <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div> <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1542157585-ef20bbcce4e7?auto=format&fit=crop&w=400&q=80" alt="Slide 8"></div>
    </div>
  </div>

  <!-- Updated to Swiper 11 JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      loop: true, 
      autoplay: {
        delay: 2500, 
        disableOnInteraction: false, 
      },
      coverflowEffect: {
        rotate: 0,       
        stretch: -20,    
        depth: 250,      
        modifier: 1,
        slideShadows: true, 
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>
</html>
