<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousal 2</title>
    <!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
 <link href="./src/output.css" rel="stylesheet">
<style>
      .swiper-slide {
        width: 300px;
        height: 300px;
        border-radius: 40px;
        overflow:hidden;
        border-radius: 20px;
        box-shadow: -1px 8px 8px #322e2e;
        filter:blur(2px);
        opacity: 0.8;
        backdrop-filter: blur(10px);
transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;

      }
      .swiper-slide-active{
        filter: blur(0);
        opacity: 1;
      }
      
</style>
</head>
<body class="w-screen h-screen flex items-center justify-center">
   <!-- Slider main container -->
<div class="swiper bg-amber-300 w-full max-w-4xl">
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper  p-10">
    <!-- Slides -->
    <div class="swiper-slide" ><img src="images/drone_race.png" alt="" class="h-full w-full object-cover"></div>
    <div class="swiper-slide"><img src="images/beach_event.png" alt="" class="h-full w-full object-cover"></div>
    <div class="swiper-slide"><img src="images/engi1.png" alt="" class="h-full w-full object-cover"></div>
    <div class="swiper-slide"><img src="images/robo_racing.png" alt="" class="h-full w-full object-cover"></div>
    <div class="swiper-slide"><img src="images/robo_soccer.png" alt="" class="h-full w-full object-cover"></div>
    <div class="swiper-slide"><img src="images/robowars.png" alt="" class="h-full w-full object-cover"></div>
     
  </div>
  <!-- If we need pagination -->
  <div class="swiper-pagination"></div>

 

  <!-- If we need scrollbar -->
  <div class="swiper-scrollbar"></div>
</div>
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
 <script>
    const swiper  = new Swiper('.swiper' , {
        direction : 'horizontal',
        slidesPerView : 'auto',
        centeredSlides : true,
        spaceBetween : 10,
        loop : true,
        pagination : {
            el : '.swiper-pagination',
            dynamicBullets : true,
            clickable : true
             
        },
        effect : 'coverflow',
        coverflowEffect : {
            rotate : 0,
            stretch : 0,
            depth: 250,
            modifier :2,
            slideShadows : true
        },
         mousewheel : {
            forceToAxis : true
         }
        
       
    } )
 </script>
</body>
</html>
